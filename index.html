<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 14px;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #111);
            color: var(--tg-theme-text-color, #fff);
        }

        .header {
            margin-bottom: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 5px 0 0;
            color: var(--tg-theme-hint-color, #999);
            font-size: 14px;
        }

        #videos {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .video-card {
            background: var(--tg-theme-secondary-bg-color, #1c1c1c);
            border-radius: 14px;
            padding: 15px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .watch {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #fff);
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .watch:active {
            opacity: 0.7;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 30px 10px;
            color: var(--tg-theme-hint-color, #999);
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🎬 Video</h1>
        <p>Pilih video yang ingin ditonton</p>
    </div>

    <div id="videos">
        <div class="loading">Memuat video...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        async function loadVideos() {

            const container = document.getElementById("videos");

            try {

                const response = await fetch("videos.json");

                if (!response.ok) {
                    throw new Error("Gagal mengambil videos.json");
                }

                const videos = await response.json();

                container.innerHTML = "";

                if (!videos.length) {
                    container.innerHTML = `
                        <div class="empty">
                            Belum ada video.
                        </div>
                    `;
                    return;
                }

                videos.forEach(video => {

                    const card = document.createElement("div");
                    card.className = "video-card";

                    const title = document.createElement("div");
                    title.className = "title";
                    title.textContent = video.judul;

                    const button = document.createElement("a");
                    button.className = "watch";
                    button.textContent = "▶ Tonton Video";
                    button.href = video.url;
                    button.target = "_blank";
                    button.rel = "noopener noreferrer";

                    card.appendChild(title);
                    card.appendChild(button);

                    container.appendChild(card);
                });

            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="error">
                        Gagal memuat daftar video.
                    </div>
                `;
            }
        }

        loadVideos();
    </script>

</body>
</html>
