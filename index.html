<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        #videos {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .video-card {
            background: #1c1c1c;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
            background: black;
        }

        .title {
            padding: 12px;
            font-size: 17px;
            font-weight: bold;
        }

        .error {
            color: #ff7777;
            padding: 10px 0;
        }
    </style>
</head>

<body>

    <h1>Video</h1>

    <div id="videos">
        Memuat video...
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        async function loadVideos() {

            const container = document.getElementById("videos");

            try {

                const response = await fetch("videos.json");

                if (!response.ok) {
                    throw new Error("videos.json tidak ditemukan");
                }

                const videos = await response.json();

                container.innerHTML = "";

                if (!videos.length) {
                    container.innerHTML = "<p>Belum ada video.</p>";
                    return;
                }

                videos.forEach(video => {

                    const card = document.createElement("div");

                    card.className = "video-card";

                    card.innerHTML = `
                        <video
                            controls
                            preload="metadata"
                            src="${video.url}">
                        </video>

                        <div class="title">
                            ${escapeHTML(video.judul)}
                        </div>
                    `;

                    container.appendChild(card);

                });

            } catch (error) {

                container.innerHTML = `
                    <div class="error">
                        Gagal memuat video: ${error.message}
                    </div>
                `;

                console.error(error);
            }
        }

        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }

        loadVideos();
    </script>

</body>
</html>
